<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>RICHARD — lecture bilingue</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow">Texte principal en français</p>
        <h1>RICHARD</h1>
      </div>
      <div class="header-actions">
        <span id="versionBadge" class="version-badge" aria-label="Version de l’application"></span>
        <button id="installButton" class="install-button" type="button" hidden>Installer</button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Outils de lecture">
        <label class="search">
          <span>Поиск</span>
          <input id="searchInput" type="search" placeholder="Фраза, персонаж, перевод…" autocomplete="off" />
        </label>
        <button id="collapseButton" type="button">Свернуть всё</button>
      </section>

      <section id="lineList" class="line-list" aria-live="polite"></section>
    </main>

    <template id="lineTemplate">
      <article class="line-card">
        <button class="line-button" type="button">
          <span class="speaker"></span>
          <span class="french"></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="details">
          <div class="translation"></div>
          <div class="note"></div>
        </div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
