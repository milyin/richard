name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate PWA data
        run: python pwa/build_data.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("pwa/data.json").read_text(encoding="utf-8"))
          assert data["title"] == "RICHARD"
          assert len(data["lines"]) == 458
          PY

      - name: Disable Jekyll
        run: touch pwa/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
